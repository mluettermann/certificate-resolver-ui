# nginx server block for the Certificate Resolver UI.
# Copy to /etc/nginx/conf.d/ (or sites-available + symlink), adjust
# server_name and certificate paths, then: nginx -t && systemctl reload nginx
# Set SECURE_COOKIES=true in the UI's .env.

server {
    listen 80;
    listen [::]:80;
    server_name cert.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx >= 1.25.1; older versions: "listen 443 ssl http2;"
    server_name cert.example.com;

    # Certificate — e.g. one issued by the resolver itself and delivered with
    # an "ssh" target (remote_cert_dir: /etc/nginx/certs,
    # reload_cmd: "systemctl reload nginx").
    ssl_certificate     /etc/nginx/certs/example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Recommended: allow private networks / VPN only.
    # allow 10.0.0.0/8;
    # allow 172.16.0.0/12;
    # allow 192.168.0.0/16;
    # deny  all;

    client_max_body_size 1m;

    location / {
        # nginx on the host. nginx as a container (with
        # deploy/proxy-network/docker-compose.proxy-network.yml):
        #   proxy_pass http://certificate-resolver-ui:5000;
        proxy_pass http://127.0.0.1:5050;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # The issue/renew output is streamed live — don't buffer it, and give
        # long-running issuances time to finish.
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }
}
