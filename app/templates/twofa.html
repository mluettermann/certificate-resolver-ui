<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="alternate icon" href="/static/favicon.ico">
<title>Two-factor authentication</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-slate-900 to-slate-800 text-slate-100">

<div class="w-full max-w-sm">
  <div class="flex flex-col items-center mb-6">
    <div class="w-16 h-16 rounded-2xl bg-blue-600/20 ring-1 ring-blue-500/40 flex items-center justify-center mb-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-9 h-9 text-blue-400" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h1 class="text-xl font-semibold">Two-factor authentication</h1>
    <p class="text-xs text-slate-400 mt-1">Enter the 6-digit code from your authenticator app, or a backup code.</p>
  </div>

  <div class="bg-slate-800/80 backdrop-blur border border-slate-700 rounded-2xl p-6 shadow-xl">
    {% if error %}
    <div class="bg-red-900/60 border border-red-700 text-red-200 text-sm rounded px-3 py-2 mb-4">{{ error }}</div>
    {% endif %}

    <form method="post" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input name="code" inputmode="numeric" autocomplete="one-time-code" autofocus placeholder="123456"
        class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-3 text-center tracking-[0.4em] text-xl focus:border-blue-500 focus:outline-none">
      <button class="w-full bg-blue-600 hover:bg-blue-500 py-2.5 rounded-lg text-sm font-medium transition">Verify</button>
    </form>
  </div>

  <a href="/logout" class="block text-center text-xs text-slate-500 hover:text-slate-300 mt-6">Cancel and sign out</a>
</div>

</body>
</html>
