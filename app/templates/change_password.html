<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="alternate icon" href="/static/favicon.ico">
<title>Change password</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4">

<div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-sm">
  <h1 class="text-lg font-semibold mb-1">Change password</h1>

  {% if forced %}
  <p class="text-xs text-amber-300 mb-4">You must change your password before continuing.</p>
  {% else %}
  <p class="text-xs text-slate-400 mb-4">Choose a new password (at least 8 characters).</p>
  {% endif %}

  {% if error %}
  <div class="bg-red-900/60 border border-red-700 text-red-200 text-sm rounded px-3 py-2 mb-4">{{ error }}</div>
  {% endif %}

  <form method="post" id="form" class="space-y-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label class="text-xs text-slate-400">Current password</label>
      <input name="old" type="password" required
        class="mt-1 w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm">
    </div>
    <div>
      <label class="text-xs text-slate-400">New password</label>
      <input name="new" id="new" type="password" required minlength="8"
        class="mt-1 w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm">
    </div>
    <div>
      <label class="text-xs text-slate-400">Confirm new password</label>
      <input name="confirm" id="confirm" type="password" required minlength="8"
        class="mt-1 w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm">
    </div>

    <p id="mismatch" class="text-xs text-red-400 hidden">New password and confirmation do not match.</p>

    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded text-sm font-medium">Change password</button>
  </form>

  {% if not forced %}
  <a href="/dashboard" class="block text-center text-xs text-slate-400 hover:text-slate-200 mt-4">← Back to dashboard</a>
  {% endif %}
</div>

<script>
const form = document.getElementById("form");
const nw = document.getElementById("new");
const cf = document.getElementById("confirm");
const mm = document.getElementById("mismatch");
form.addEventListener("submit", (e) => {
  if (nw.value !== cf.value){ e.preventDefault(); mm.classList.remove("hidden"); }
});
cf.addEventListener("input", () => { if (nw.value === cf.value) mm.classList.add("hidden"); });
</script>
</body>
</html>
