<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="alternate icon" href="/static/favicon.ico">
<title>Sign in · Certificate Resolver</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-slate-900 to-slate-800 text-slate-100">

<div class="w-full max-w-sm">

  <!-- Logo / graphic -->
  <div class="flex flex-col items-center mb-6">
    <div class="w-16 h-16 rounded-2xl bg-blue-600/20 ring-1 ring-blue-500/40 flex items-center justify-center mb-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-9 h-9 text-blue-400" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"></path>
        <path d="M9 12l2 2 4-4"></path>
      </svg>
    </div>
    <h1 class="text-xl font-semibold">Certificate Resolver</h1>
    <p class="text-xs text-slate-400 mt-1">Sign in to manage your certificates</p>
  </div>

  <div class="bg-slate-800/80 backdrop-blur border border-slate-700 rounded-2xl p-6 shadow-xl">
    {% if error %}
    <div class="bg-red-900/60 border border-red-700 text-red-200 text-sm rounded px-3 py-2 mb-4">{{ error }}</div>
    {% endif %}

    <form method="post" class="space-y-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="text-xs text-slate-400">Username</label>
        <input name="username" autofocus required
          class="mt-1 w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
      </div>
      <div>
        <label class="text-xs text-slate-400">Password</label>
        <input name="password" type="password" required
          class="mt-1 w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:border-blue-500 focus:outline-none">
      </div>
      <button class="w-full bg-blue-600 hover:bg-blue-500 py-2.5 rounded-lg text-sm font-medium transition">Sign in</button>
    </form>
  </div>

  <p class="text-center text-xs text-slate-500 mt-6">Protected by two-factor authentication</p>
</div>

</body>
</html>
