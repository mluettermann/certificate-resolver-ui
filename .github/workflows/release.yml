# Release pipeline (release-please + container image)
#
#   push to main        -> release-please opens/updates the release PR,
#                          image is published as :edge
#   release PR merged   -> tag + GitHub release vX.Y.Z, image is published as
#                          :X.Y.Z, :X.Y, :X and :latest
#   pull request        -> image is built (not pushed) as a check
#
# The image is built in the same workflow on purpose: tags created with the
# default GITHUB_TOKEN do not trigger other workflows.
#
# Commit messages must follow Conventional Commits (feat:, fix:, feat!: ...)
# so release-please can pick the next version and write the changelog.
name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/certificate-resolver-ui

jobs:
  release-please:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    needs: release-please
    # also runs on pull requests, where release-please is skipped
    if: ${{ !cancelled() && needs.release-please.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ needs.release-please.outputs.release_created == 'true' }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # QEMU is required to build the linux/arm64 image on an amd64 runner
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ env.VERSION }},enable=${{ env.RELEASE }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSION }},enable=${{ env.RELEASE }}
            type=semver,pattern={{major}},value=v${{ env.VERSION }},enable=${{ env.RELEASE }}
            type=raw,value=latest,enable=${{ env.RELEASE }}
            type=edge,branch=main
            type=sha,format=short,enable=${{ github.event_name != 'pull_request' }}

      - name: Build (and push unless PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
